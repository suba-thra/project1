# ==========================================
# Application Configuration
# ==========================================
spring.application.name=quiz-backend
server.port=${PORT:8080}

# Active profile ('h2' for instant development without local MySQL; 'mysql' for MySQL 8)
spring.profiles.active=h2

# ==========================================
# MySQL 8 Database Connection
# Configured dynamically using Environment Variables:
# - DB_URL: Database connection URL
# - DB_USERNAME: Database username
# - DB_PASSWORD: Database password (NOT hardcoded)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate ORM Settings
# ==========================================
# "update" updates database schema automatically when entity models change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Keep schema.sql as reference DDL, let JPA/Hibernate manage schema
spring.sql.init.mode=never

# ==========================================
# Swagger / OpenAPI 3 Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
